spring.application.name=flotte-service

# MySQL - XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/rentify_flotte
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port du microservice
server.port=8081

# Désactiver Config Server pour le moment
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# RabbitMQ - Bus d'evenements Rentify
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# Activation des listeners RabbitMQ
spring.rabbitmq.listener.simple.auto-startup=${RABBIT_ENABLED:false}

# Echange partage avec Reservation
rentify.events.exchange=rentify.events

# Health RabbitMQ
management.health.rabbit.enabled=${RABBIT_ENABLED:false}
