# ===== Configuration du microservice Facturation =====
server:
  port: 8085

spring:
  application:
    name: facturation-service

  # Base MySQL (XAMPP) : une base propre à ce service (facturation_db), créée automatiquement
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:facturation_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update        # crée / met à jour les tables automatiquement
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000   # ms
            readTimeout: 3000      # ms

# Appels vers les autres microservices (adresses directes ; Eureka viendra à l'intégration)
rentify:
  contrats:
    url: ${CONTRATS_URL:http://localhost:8083}
  reservation:
    url: ${RESERVATION_URL:http://localhost:8082}
  infractions:
    url: ${INFRACTIONS_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ===== Service Discovery (chapitre 4) : Eureka Client =====
# Inactif par défaut ; activé par le profil "eureka" (voir application-eureka.yml).
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true            # le statut de /actuator/health est publié dans Eureka
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Visible dans /actuator/info et dans le dashboard Eureka
info:
  app:
    name: facturation-service
    description: Rentify - microservice facturation
